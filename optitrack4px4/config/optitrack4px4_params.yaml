# Default parameters for optitrack_client.
# Edit this file for your lab (with --symlink-install no rebuild is needed),
# pass your own with `params_file:=/path/to.yaml`, or override any single
# value on the command line, e.g. `server_address:=192.168.1.50`.
optitrack_client:
  ros__parameters:
    connection_type: "Unicast"          # Unicast or Multicast
    server_address: "192.168.1.113"     # IP of the PC running Motive
    local_address: "192.168.1.200"      # IP of this machine on the same LAN
    multicast_address: "239.255.42.99"  # only used in Multicast mode
    server_command_port: 1510
    server_data_port: 1511
    namespace: "optitrack"              # topics: /<namespace>/<rigid_body>/<rigid_body>
    world_frame: "map"
    optitrack_frame: "optitrack"
    map_xyz: [0.0, 0.0, 0.0]            # static world_frame -> optitrack_frame translation (m)
    map_rpy: [0.0, 0.0, 0.0]            # static world_frame -> optitrack_frame rotation
    map_rpy_in_degrees: false
